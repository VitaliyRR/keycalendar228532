<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Пилот и переключение"><title>Пилот и переключение</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><text x="23" y="142" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Пилот и переключение</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-MIG-03  /  Переключение первого клиента и откат; один writer и подтверждённая сохранность активных обязательств</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="170" width="201" height="25" rx="4" fill="#FFF2D9"/><text x="226" y="187" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Пилот · переход ещё не начат</text><rect x="216" y="225" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Условие</text><text x="555.0909090909091" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Ответственный</text><text x="771.8181818181819" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Доказательство</text><text x="1169.1515151515152" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Результат</text><rect x="216" y="267" width="1192" height="72" rx="0" fill="#FFFFFF"/><path d="M216 339H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="298" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Полнота исходных данных</text><text x="555.0909090909091" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Владелец данных</text><text x="771.8181818181819" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">ID, статусы, валюты и связи</text><rect x="1167.1515151515152" y="281" width="104" height="25" rx="4" fill="#FBECEE"/><text x="1177.1515151515152" y="298" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Не завершено</text><rect x="216" y="339" width="1192" height="72" rx="0" fill="#FFFFFF"/><path d="M216 411H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="370" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Проверка активных дат</text><text x="555.0909090909091" y="370" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Менеджер</text><text x="771.8181818181819" y="370" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Без пересечений и пропусков</text><rect x="1167.1515151515152" y="353" width="76" height="25" rx="4" fill="#FFF2D9"/><text x="1177.1515151515152" y="370" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Ожидает</text><rect x="216" y="411" width="1192" height="72" rx="0" fill="#FFFFFF"/><path d="M216 483H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="442" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Деньги и залоги</text><text x="555.0909090909091" y="442" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Бухгалтер</text><text x="771.8181818181819" y="442" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Подписанная сверка остатков</text><rect x="1167.1515151515152" y="425" width="76" height="25" rx="4" fill="#FFF2D9"/><text x="1177.1515151515152" y="442" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Ожидает</text><rect x="216" y="483" width="1192" height="72" rx="0" fill="#FFFFFF"/><path d="M216 555H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="514" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Каналы и возврат к источнику</text><text x="555.0909090909091" y="514" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Инженер</text><text x="771.8181818181819" y="514" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Один источник изменений</text><rect x="1167.1515151515152" y="497" width="76" height="25" rx="4" fill="#FFF2D9"/><text x="1177.1515151515152" y="514" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Ожидает</text><rect x="216" y="555" width="1192" height="72" rx="0" fill="#FFFFFF"/><path d="M216 627H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="586" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Приёмка первого заказчика</text><text x="555.0909090909091" y="586" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Владелец</text><text x="771.8181818181819" 
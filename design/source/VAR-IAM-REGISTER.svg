<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Создать аккаунт"><title>Создать аккаунт</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="360" y="86" width="720" height="778" rx="7" fill="#FFFFFF" stroke="#D6DDE3"/><text x="410" y="154" fill="#202B36" font-family="Golos Text" font-size="23" font-weight="600">Кей Календарь</text><text x="410" y="229" fill="#202B36" font-family="Golos Text" font-size="27" font-weight="600">Создать аккаунт</text><text x="410" y="288" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Имя *</text><rect x="410" y="298" width="620" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="422" y="324" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Менеджер М-01</text><text x="410" y="376" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Рабочая почта *</text><rect x="410" y="386" width="620" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="422" y="412" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">manager@example.test</text><text x="410" y="464" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Пароль *</text><rect x="410" y="474" width="620" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="422" y="500" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">••••••••••••</text><text x="410" y="552" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Повтор пароля *</text><rect x="410" y="562" width="620" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="422" y="588" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">••••••••••••</text><text x="410" y="644" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Подтвер
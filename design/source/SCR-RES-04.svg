<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Отмена и восстановление"><title>Отмена и восстановление</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><rect x="10" y="120" width="164" height="34" rx="4" fill="#EAF0FA"/><rect x="10" y="120" width="3" height="34" rx="0" fill="#2458A6"/><text x="23" y="142" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Отмена и восстановление</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-RES-04  /  Снять бронь с продажи, сохранив историю и финансовые связи.</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="226" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="252" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Бронь</text><text x="468.4" y="252" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Гость</text><text x="706.8" y="252" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Проживание</text><text x="945.1999999999999" y="252" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Оплачено</text><text x="1183.6" y="252" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Условия</text><rect x="216" y="268" width="1192" height="53" rx="0" fill="#FFFFFF"/><path d="M216 321H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="299" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">КК-1042</text><text x="468.4" y="299" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Гость А-01</text><text x="706.8" y="299" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">24–27 сентября</text><text x="945.1999999999999" y="299" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">4 200 ₽</text><text x="1183.6" y="299" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Стандартный тариф</text><rect x="355" y="371" width="934" height="454" rx="7" fill="#FFFFFF" stroke="#D6DDE3"/><text x="387" y="415" fill="#202B36" font-family="Golos Text" font-size="23" font-weight="600">Отменить бронирование?</text><text x="387" y="454" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Бронь перестанет закрывать даты. Возврат денег оформляется отдельно, по принятой версии условий.</text><text x="387" y="523" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="500">Начисления после отмены: 0 ₽ · Штраф: 0 ₽</text><text x="387" y="550" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Оплачено: 4 200 ₽ · Переплата: 4 200 ₽ · Доступно вернуть: 4 200 ₽</text><text x="387" y="594" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Причина *</text><rect x="387" y="604" width="838" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="399" y="630" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Отмена по просьбе гостя</text><rect x="964" y="693" width="148" height="25" rx="4" fill="#FFF2D9"/><text x="974" y="710" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Возврат не выполнен</text><rect x="387" y="694" width="208" height="36" rx="5" fill="#A52A38"/><text x="402" y="717.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Отменить бронь</text><rect x="615" y="694" width="200" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="630" y="717.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Оставить бронь</text><text x="387" y="789" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">При восстановлении даты проверяются заново. Конфликт нельзя подтвердить обходом.</text></svg>
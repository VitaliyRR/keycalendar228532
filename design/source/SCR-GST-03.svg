t="400">К доплате</text><text x="1208" y="526" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="500">8 400 ₽</text><text x="922" y="581" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Возвратный залог отдельно</text><text x="1208" y="581" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="500">3 000 ₽</text><path d="M922 614H1320" stroke="#D6DDE3" stroke-width="1"/><text x="922" y="652" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Бесплатная отмена по условиям выбранного тарифа.</text><text x="922" y="674" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Условия и получатель платежа доступны до оплаты.</text><rect x="922" y="773" width="398" height="36" rx="5" fill="#2458A6"/><text x="937" y="796.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Внести доплату</text><text x="96" y="903" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Условия бронирования · Политика обработки данных · Реквизиты получателя</text><text x="96" y="938" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">SCR-GST-03 · Демонстрационные данные, редактируемый макет</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Кабинет гостя"><title>Кабинет гостя</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#FFFFFF"/><text x="96" y="48" fill="#202B36" font-family="Golos Text" font-size="24" font-weight="600">Дом у парка</text><text x="1110" y="47" fill="#2458A6" font-family="Golos Text" font-size="14" font-weight="400">Связаться с хозяином</text><text x="96" y="139" fill="#202B36" font-family="Golos Text" font-size="28" font-weight="600">Ваше бронирование</text><text x="96" y="174" fill="#596775" font-family="Golos Text" font-size="15" font-weight="400">КК-1042 · подтверждено</text><rect x="96" y="211" width="778" height="640" rx="6" fill="#FFFFFF" stroke="#D6DDE3"/><rect x="898" y="211" width="446" height="640" rx="6" fill="#FFFFFF" stroke="#D6DDE3"/><text x="120" y="254" fill="#202B36" font-family="Golos Text" font-size="20" font-weight="600">Проживание</text><text x="120" y="303" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Адрес</text><text x="120" y="328" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="400">Демонстрационный адрес · Парковая 12</text><text x="120" y="366" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Заезд</text><text x="120" y="391" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="400">24 сентября · с 15:00</text><text x="120" y="429" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Выезд</text><text x="120" y="454" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="400">27 сентября · до 11:00</text><text x="120" y="492" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Гости</text><text x="120" y="517" fill="#202B36" font-fami
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Подтвердите вход"><title>Подтвердите вход</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="360" y="86" width="720" height="778" rx="7" fill="#FFFFFF" stroke="#D6DDE3"/><text x="410" y="154" fill="#202B36" font-family="Golos Text" font-size="23" font-weight="600">Кей Календарь</text><text x="410" y="229" fill="#202B36" font-family="Golos Text" font-size="27" font-weight="600">Подтвердите вход</text><text x="410" y="288" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Код из приложения *</text><rect x="410" y="298" width="620" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="422" y="324" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">123 456</text><text x="410" y="380" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Нет устройства? Введите один из резервных кодов. Каждый код используется один</text><text x="410" y="402" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">раз.</text><rect x="410" y="448" width="620" height="36" rx="5" fill="#2458A6"/><text x="425" y="471.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Подтвердить</text><text x="410" y="538" fill="#2458A6" font-family="Golos Text" font-size="14" font-weight="400">Вернуться ко входу</text><text x="360" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">VAR-IAM-MFA · Демонстрационные данные</text></svg>
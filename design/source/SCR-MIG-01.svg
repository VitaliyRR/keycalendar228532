<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Импорт и экспорт"><title>Импорт и экспорт</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><text x="23" y="142" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Импорт и экспорт</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-MIG-01  /  Импорт и сопоставление данных; нормализованные кандидаты с provenance и review flags</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><text x="216" y="190" fill="#2458A6" font-family="Golos Text" font-size="14" font-weight="500">1  Файл      2  Соответствия      3  Проверка      4  Подтверждение</text><rect x="216" y="225" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Поле источника</text><text x="448.2535211267606" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Целевое поле</text><text x="700.0845070422536" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Правило</text><text x="1069.4366197183099" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Результат</text><rect x="216" y="267" width="1192" height="67" rx="0" fill="#FFFFFF"/><path d="M216 334H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="298" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Объект</text><text x="448.2535211267606" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">unit_id</text><text x="700.0845070422536" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Через подтверждённую таблицу</text><rect x="1067.4366197183099" y="281" width="139" height="25" rx="4" fill="#FFF2D9"/><text x="1077.4366197183099" y="298" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Нужно сопоставить</text><rect x="216" y="334" width="1192" height="67" rx="0" fill="#FFFFFF"/><path d="M216 401H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="365" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Заезд / Выезд</text><text x="448.2535211267606" y="365" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">stay dates</text><text x="700.0845070422536" y="365" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Часовой пояс объекта</text><rect x="1067.4366197183099" y="348" width="135" height="25" rx="4" fill="#E6F3EC"/><text x="1077.4366197183099" y="365" fill="#19644C" font-family="Golos Text" font-size="12" font-weight="500">Формат распознан</text><rect x="216" y="401" width="1192" height="67" rx="0" fill="#FFFFFF"/><path d="M216 468H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="432" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Сумма</text><text x="448.2535211267606" y="432" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">source booking total</text><text x="700.0845070422536" y="432" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Не создавать платёж</text><rect x="1067.4366197183099" y="415" width="134" height="25" rx="4" fill="#FFF2D9"/><text x="1077.4366197183099" y="432" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Требуется валюта</text><rect x="216" y="468" width="1192" height="67" rx="0" fill="#FFFFFF"/><path d="M216 535H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="499" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">ID / Статус</text><text x="448.2535211267606" y="499" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Не предоставлены</text><text x="700.0845070422536" y="499" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Дополнительный экспорт</text><rect x="1067.4366197183099" y="482" width="176" height="25" rx="4" fill="#FBECEE"/><text x="1077.4366197183099" y="499" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Блокирует переключение</text><rect x="216" y="612" width="1192" height="246" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="650" fill="#202B36" font-family="Golos Text" font-size="20" font-weight="600">Импорт в рабочую организацию ещё не выполнен</text><text x="240" y="690" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">В режиме проверки формируется план изменений и отчёт расхождений. Дубли, пропуски, деньги и пересечения решаются до включения каналов.</text><rect x="240" y="776" width="233" height="36" rx="5" fill="#2458A6"/><text x="255" y="799.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Запустить проверку</text><rect x="493" y="776" width="245" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="508" y="799.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Скачать расхождения</text><rect x="1058" y="782" width="151" height="25" rx="4" fill="#FFF2D9"/><text x="1068" y="799" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Запуск заблокирован</text></svg>
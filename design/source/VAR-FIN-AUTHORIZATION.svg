son</text><rect x="216" y="170" width="244" height="25" rx="4" fill="#EAF0FA"/><text x="226" y="187" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Режим: блокировка средств на карте</text><rect x="216" y="225" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Бронь</text><text x="413.38461538461536" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Заблокировано</text><text x="633.4461538461538" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Получено денег</text><text x="853.5076923076923" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Срок блокировки</text><text x="1165.2615384615385" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Состояние</text><rect x="216" y="267" width="1192" height="80" rx="0" fill="#FFFFFF"/><path d="M216 347H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="298" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">КК-1042</text><text x="413.38461538461536" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">3 000 ₽</text><text x="633.4461538461538" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">0 ₽</text><text x="853.5076923076923" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">26 сентября · 12:00</text><rect x="1163.2615384615385" y="281" width="98" height="25" rx="4" fill="#EAF0FA"/><text x="1173.2615384615385" y="298" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Авторизация</text><rect x="216" y="433" width="1192" height="423" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="478" fill="#202B36" font-family="Golos Text" font-size="23" font-weight="600">Средства заблокированы, но не списаны</text><text x="240" y="525" fill="#596775" font-family="Golos Text" font-size="16" font-weight="400">Снятие блокировки освобождает сумму на карте гостя. Это не возврат полученных денег. Срок фактического освобождения зависит от</text><text x="240" y="547" fill="#596775" font-family="Golos Text" font-size="16" font-weight="400">банка.</text><text x="240" y="615" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">После истечения срока нельзя удержать сумму без новой разрешённой операции.</text><rect x="240" y="690" width="259" height="36" rx="5" fill="#2458A6"/><text x="255" y="713.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Снять блокировку</text><rect x="519" y="690" width="301" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="534" y="713.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Основание для списания</text><rect x="240" y="794" width="351" height="25" rx="4" fill="#FFF2D9"/><text x="250" y="811" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Списание доступно только при поддержке провайдера</text><rect x="184" y="894" width="1256" height="66" rx="0" fill="#F4F5F7"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">VAR-FIN-AUTHORIZATION · SCR-FIN-04 · Данные вымышлены</text></svg>
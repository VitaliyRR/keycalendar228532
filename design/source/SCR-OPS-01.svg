<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Состояние сервиса"><title>Состояние сервиса</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><text x="23" y="142" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><rect x="10" y="360" width="164" height="34" rx="4" fill="#EAF0FA"/><rect x="10" y="360" width="3" height="34" rx="0" fill="#2458A6"/><text x="23" y="382" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Состояние сервиса</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-OPS-01  /  Резервное копирование и восстановление; измеренные rpo/rto и сверка целостности</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="171" width="249" height="25" rx="4" fill="#EAF0FA"/><text x="226" y="188" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Контур платформы · отдельные права</text><rect x="216" y="225" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Контроль</text><text x="460.7096774193548" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Последний результат</text><text x="883.6774193548388" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Целевой порог</text><text x="1114.3870967741937" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Состояние</text><rect x="216" y="267" width="1192" height="68" rx="0" fill="#FFFFFF"/><path d="M216 335H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="298" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Резервное копирование</text><text x="460.7096774193548" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Последняя копия подтверждена</text><text x="883.6774193548388" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">RPO ≤ 15 мин</text><rect x="1112.3870967741937" y="281" width="61" height="25" rx="4" fill="#E6F3EC"/><text x="1122.3870967741937" y="298" fill="#19644C" font-family="Golos Text" font-size="12" font-weight="500">Норма</text><rect x="216" y="335" width="1192" height="68" rx="0" fill="#FFFFFF"/><path d="M216 403H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="366" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Восстановление</text><text x="460.7096774193548" y="366" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Учебное восстановление</text><text x="883.6774193548388" y="366" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">RTO ≤ 4 ч</text><rect x="1112.3870967741937" y="349" width="140" height="25" rx="4" fill="#FFF2D9"/><text x="1122.3870967741937" y="366" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Требует протокола</text><rect x="216" y="403" width="1192" height="68" rx="0" fill="#FFFFFF"/><path d="M216 471H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="434" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Очередь каналов</text><text x="460.7096774193548" y="434" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Возраст старейшего события</text><text x="883.6774193548388" y="434" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">По классу коннектора</text><rect x="1112.3870967741937" y="417" width="85" height="25" rx="4" fill="#FFF2D9"/><text x="1122.3870967741937" y="434" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Проверить</text><rect x="216" y="471" width="1192" height="68" rx="0" fill="#FFFFFF"/><path d="M216 539H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="502" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">API календаря</text><text x="460.7096774193548" y="502" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">p95 при согласованной нагрузке</text><text x="883.6774193548388" y="502" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">≤ 800 мс</text><rect x="1112.3870967741937" y="485" width="111" height="25" rx="4" fill="#EAF0FA"/><text x="1122.3870967741937" y="502" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Цель, не замер</text><text x="216" y="653" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Показатели в макете иллюстрируют контроль. Они не являются измерениями текущей системы или обещанием SLA поставщика канала.</text><rect x="216" y="760" width="319" height="36" rx="5" fill="#2458A6"/><text x="231" y="783.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Открыть план восстановления</text></svg>
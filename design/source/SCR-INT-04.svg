t="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><rect x="10" y="400" width="164" height="34" rx="4" fill="#EAF0FA"/><rect x="10" y="400" width="3" height="34" rx="0" fill="#2458A6"/><text x="23" y="422" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Ошибки обмена и конфликты</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-INT-04  /  Надёжный обмен и конфликты каналов; подтверждённые внешние факты не теряются; конфликты видны</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="170" width="207" height="25" rx="4" fill="#FBECEE"/><text x="226" y="187" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Есть неразрешённый конфликт</text><rect x="1132" y="165" width="276" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1147" y="188.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">История обмена</text><rect x="216" y="225" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Событие</text><text x="382.8205128205128" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Канал</text><text x="535.6410256410256" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Объект</text><text x="810.7179487179487" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Причина</text><text x="1131.6410256410256" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Статус</text><rect x="216" y="267" width="1192" height="53" rx="0" fill="#FFFFFF"/><path d="M216 320H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="298" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">EVT-104</text><text x="382.8205128205128" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Avito</text><text x="535.6410256410256" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Парковая 12 · 101</text><text x="810.7179487179487" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Внешняя бронь пересекается</text><rect x="1129.6410256410256" y="281" width="115" height="25" rx="4" fill="#FBECEE"/><text x="1139.6410256410256" y="298" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Нужно решение</text><rect x="216" y="320" width="1192" height="53" rx="0" fill="#FFFFFF"/><path d="M216 373H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="351" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">EVT-105</text><text x="382.8205128205128" y="351" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Суточно.ру</text><text x="535.6410256410256" y="351" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Парковая 12 · 102</text><text x="810.7179487179487" y="351" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Неизвестен ответ запроса</text><rect x="1129.6410256410256" y="334" width="147" height="25" rx="4" fill="#FFF2D9"/><text x="1139.6410256410256" y="351" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Выполняется сверка</text><rect x="216" y="440" width="1192" height="420" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="481" fill="#202B36" font-family="Golos Text" font-size="20" font-weight="600">Конфликт нельзя устранить удалением входящего события</text><rect x="240" y="515" width="1144" height="42" rx="0" fill="#E9EDF1"/><text x="254" y="541" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Источник</text><text x="508.2222222222222" y="541" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Даты</text><text x="720.074074074074" y="541" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Статус</text><text x="974.2962962962962" y="541" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Управляет полями</text><rect x="240" y="557" width="1144" height="57" rx="0" fill="#FFFFFF"/><path d="M240 614H1384" stroke="#D6DDE3" stroke-width="1"/><text x="254" y="588" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Кей Календарь</text><text x="508.2222222222222" y="588" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">25–27 сен</text><text x="720.074074074074" y="588" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Подтверждена</text><text x="974.2962962962962" y="588" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Размещение и локальные заметки</text><rect x="240" y="614" width="1144" height="57" rx="0" fill="#FFFFFF"/><path d="M240 671H1384" stroke="#D6DDE3" stroke-width="1"/><text x="254" y="645" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Канал</text><text x="508.2222222222222" y="645" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">26–28 сен</text><text x="720.074074074074" y="645" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Получена извне</text><text x="974.2962962962962" y="645" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Внешний ID, цена и статус OTA</text><text x="240" y="730" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Прямые продажи закрыты. Каналам отправлено закрытие; подтверждения видны в журнале. Согласуйте размещение и зафиксируйте решение.</text><rect x="240" y="797" width="275" height="36" rx="5" fill="#2458A6"/><text x="255" y="820.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Назначить ответственного</text><rect x="533" y="797" width="250" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="548" y="820.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Просмотреть варианты</text></svg>
" fill="#FFFFFF"/><path d="M216 419H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="374" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Договор проживания</text><text x="509.6049382716049" y="374" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Оформление условий</text><text x="745.0617283950617" y="374" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">v3 · 24 сентября</text><rect x="949.0864197530864" y="357" width="81" height="25" rx="4" fill="#E6F3EC"/><text x="959.0864197530864" y="374" fill="#19644C" font-family="Golos Text" font-size="12" font-weight="500">Подписан</text><text x="1201.2592592592591" y="374" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Скачать</text><rect x="216" y="419" width="1192" height="76" rx="0" fill="#FFFFFF"/><path d="M216 495H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="450" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Согласие на рассылку</text><text x="509.6049382716049" y="450" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Email предложения</text><text x="745.0617283950617" y="450" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Не предоставлено</text><rect x="949.0864197530864" y="433" width="103" height="25" rx="4" fill="#E9EDF1"/><text x="959.0864197530864" y="450" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Нет согласия</text><text x="1201.2592592592591" y="450" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Запросить отдельно</text><rect x="216" y="591" width="1192" height="252" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="633" fill="#202B36" font-family="Golos Text" font-size="21" font-weight="600">Добавить документ</text><text x="240" y="674" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">PDF, JPEG или PNG. Файл проходит проверку до просмотра. Срок хранения зависит от цели и применимого основания.</text><rect x="240" y="758" width="214" height="36" rx="5" fill="#2458A6"/><text x="255" y="781.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Выбрать файл</text><rect x="474" y="758" width="219" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="489" y="781.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">История доступа</text></svg>
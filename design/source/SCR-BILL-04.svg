<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Подписка закончилась"><title>Подписка закончилась</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><text x="23" y="142" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Подписка закончилась</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-BILL-04  /  Просрочка, read-only и восстановление; поведение ограничений предсказуемо</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="171" width="111" height="25" rx="4" fill="#FFF2D9"/><text x="226" y="188" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Только чтение</text><rect x="216" y="230" width="1192" height="260" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="275" fill="#202B36" font-family="Golos Text" font-size="23" font-weight="600">Подписка организации</text><text x="240" y="315" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Выберите план по числу объектов и сотрудников. Стоимость и условия продления будут показаны перед оплатой.</text><text x="240" y="405" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="400">Объекты: 6 / лимит плана</text><text x="680" y="405" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="400">Сотрудники: 4 / лимит плана</text><rect x="1157" y="405" width="224" height="36" rx="5" fill="#2458A6"/><text x="1172" y="428.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Выбрать план</text><rect x="216" y="525" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="551" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Возможность</text><text x="573.8461538461538" y="551" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">После окончания подписки</text><text x="963.5384615384614" y="551" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Что доступно</text><rect x="216" y="567" width="1192" height="78" rx="0" fill="#FFFFFF"/><path d="M216 645H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="598" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Новые продажи и правки</text><text x="573.8461538461538" y="598" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">После льготного периода ограничены</text><text x="963.5384615384614" y="598" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Просмотр и экспорт</text><rect x="216" y="645" width="1192" height="78" rx="0" fill="#FFFFFF"/><path d="M216 723H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="676" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Входящие брони / платежи</text><text x="573.8461538461538" y="676" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Продолжают приниматься</text><text x="963.5384615384614" y="676" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Сверка и аварийное закрытие продаж</text><rect x="216" y="723" width="1192" height="78" rx="0" fill="#FFFFFF"/><path d="M216 801H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="754" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Доступ к данным</text><text x="573.8461538461538" y="754" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Без немедленного удаления</text><text x="963.5384615384614" y="754" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Уведомления и восстановление</text></svg>
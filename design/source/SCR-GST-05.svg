t="34" rx="0" fill="#2458A6"/><text x="23" y="262" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Договор с гостем</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-GST-05  /  Зафиксировать версию условий и действие гостя.</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="165" width="140" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="231" y="188.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">← Профиль гостя</text><rect x="461" y="171" width="149" height="25" rx="4" fill="#EAF0FA"/><text x="471" y="188" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Гость А-01 · КК-1042</text><rect x="216" y="225" width="828" height="632" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="267" fill="#202B36" font-family="Golos Text" font-size="22" font-weight="600">Договор проживания · предпросмотр</text><text x="240" y="327" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="600">1. Проживание</text><text x="240" y="360" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Парковая 12 · 101. Заезд 24 сентября 2026, выезд 27 сентября 2026. Два взрослых.</text><text x="240" y="464" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="600">2. Цена и расчёты</text><text x="240" y="497" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Стоимость проживания 12 600 ₽. Предоплата 4 200 ₽. Остаток 8 400 ₽. Возвратный залог 3 000 ₽</text><text x="240" y="519" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">отдельно.</text><text x="240" y="601" fill="#202B36" font-family="Golos Text" font-size="16" font-weight="600">3. Условия</text><text x="240" y="634" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Действуют принятые правила проживания и отмены тарифа. Реквизиты сторон заполняются из</text><text x="240" y="656" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">проверенных данных.</text><rect x="240" y="795" width="329" height="25" rx="4" fill="#FFF2D9"/><text x="250" y="812" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Демонстрационный текст, не юридический шаблон</text><text x="1076" y="267" fill="#202B36" font-family="Golos Text" font-size="19" font-weight="600">Подписание</text><text x="1076" y="320" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Шаблон</text><rect x="1076" y="330" width="308" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1088" y="356" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Проживание · версия 3</text><text x="1076" y="418" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Способ</text><rect x="1076" y="428" width="308" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1088" y="454" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Разрешённый провайдер</text><rect x="1076" y="510" width="177" height="25" rx="4" fill="#FFF2D9"/><text x="1086" y="527" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Подпись ещё не получена</text><rect x="1076" y="581" width="308" height="36" rx="5" fill="#2458A6"/><text x="1091" y="604.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Проверить реквизиты</text><rect x="1076" y="636" width="308" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1091" y="659.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Скачать черновик</text></svg>
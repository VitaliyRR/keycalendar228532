t><text x="416.25" y="462" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Доход размещения / доступные ночи</text><text x="788.75" y="462" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">По выбранному знаменателю</text><text x="1105.375" y="462" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Двойной учёт категорий</text><rect x="216" y="513" width="1192" height="82" rx="0" fill="#FFFFFF"/><path d="M216 595H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="544" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Кассовый поток</text><text x="416.25" y="544" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Поступления − возвраты − расходы</text><text x="788.75" y="544" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Проведённые операции</text><text x="1105.375" y="544" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Ожидающие платежи</text><text x="216" y="688" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Метод и определения сохраняются в выгрузке вместе с фильтрами, часовым поясом и датой формирования. Реестр операций сверяется отдельно.</text><rect x="216" y="787" width="337" height="36" rx="5" fill="#2458A6"/><text x="231" y="810.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Скачать отчёт с определениями</text></svg>
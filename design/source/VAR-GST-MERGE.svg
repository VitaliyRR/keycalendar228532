ont-weight="400">guest-a01@example.test</text><text x="240" y="552" fill="#202B36" font-family="Golos Text" font-size="18" font-weight="500">Бронирования</text><rect x="240" y="574" width="696" height="42" rx="0" fill="#E9EDF1"/><text x="254" y="600" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Номер</text><text x="486.0" y="600" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Проживание</text><text x="718.0" y="600" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Сумма</text><rect x="240" y="616" width="696" height="57" rx="0" fill="#FFFFFF"/><path d="M240 673H936" stroke="#D6DDE3" stroke-width="1"/><text x="254" y="647" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">КК-1042</text><text x="486.0" y="647" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">24–27 сен</text><text x="718.0" y="647" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">12 600 ₽</text><rect x="240" y="673" width="696" height="57" rx="0" fill="#FFFFFF"/><path d="M240 730H936" stroke="#D6DDE3" stroke-width="1"/><text x="254" y="704" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">КК-0814</text><text x="486.0" y="704" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">10–12 июн</text><text x="718.0" y="704" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">8 400 ₽</text><rect x="994" y="225" width="414" height="635" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1018" y="267" fill="#202B36" font-family="Golos Text" font-size="17" font-weight="600">Документы и основания</text><rect x="1018" y="301" width="145" height="25" rx="4" fill="#FFF2D9"/><text x="1028" y="318" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Требуется проверка</text><text x="1018" y="360" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Согласие на рассылку не заменяет основание</text><text x="1018" y="382" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">обработки для проживания. Версия текста, цель</text><text x="1018" y="404" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">и дата фиксируются отдельно.</text><rect x="1018" y="496" width="364" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1033" y="519.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Просмотреть документ</text><rect x="1018" y="550" width="364" height="36" rx="5" fill="#2458A6"/><text x="1033" y="573.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Подготовить договор</text><text x="1018" y="644" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Не показывать паспортные данные в списках и</text><text x="1018" y="666" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">уведомлениях. Открытие документа фиксируется в</text><text x="1018" y="688" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">аудите.</text><rect x="184" y="64" width="1256" height="815" fill="#202B36" opacity="0.22"/><rect x="437" y="291" width="740" height="374" rx="8" fill="#FFFFFF" stroke="#D6DDE3"/><rect x="469" y="321" width="147" height="25" rx="4" fill="#FFF2D9"/><text x="479" y="338" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Требуется внимание</text><text x="469" y="389" fill="#202B36" font-family="Golos Text" font-size="24" font-weight="600">Похожие контакты</text><text x="469" y="435" fill="#596775" font-family="Golos Text" font-size="16" font-weight="400">Совпадение номера телефона не доказывает, что это один человек. Сравните</text><text x="469" y="461" fill="#596775" font-family="Golos Text" font-size="16" font-weight="400">брони и документы перед объединением.</text><rect x="469" y="580" width="310" height="36" rx="5" fill="#2458A6"/><text x="484" y="603.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Сравнить профили</text><rect x="801" y="580" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="816" y="603.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Закрыть</text><rect x="184" y="894" width="1256" height="66" rx="0" fill="#F4F5F7"/><text x="216" y="924" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">VAR-GST-MERGE · SCR-GST-02 · Похожие контакты</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Проверка переноса"><title>Проверка переноса</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><text x="23" y="142" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><text x="23" y="502" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Проверка переноса</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-MIG-02  /  Dry-run и сверка миграции; отчёт различий и blockers до production apply</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="216" y="171" width="234" height="25" rx="4" fill="#EAF0FA"/><text x="226" y="188" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Проверка без записи в организацию</text><rect x="1156" y="165" width="252" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="1171" y="188.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Скачать расхождения</text><rect x="216" y="225" width="1192" height="42" rx="0" fill="#E9EDF1"/><text x="230" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Строка</text><text x="374.97297297297297" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Проверка</text><text x="584.3783783783783" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Проблема</text><text x="906.5405405405404" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Решение</text><text x="1228.7027027027025" y="251" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Состояние</text><rect x="216" y="267" width="1192" height="80" rx="0" fill="#FFFFFF"/><path d="M216 347H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="298" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">SRC-001</text><text x="374.97297297297297" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">ID / статус</text><text x="584.3783783783783" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Не предоставлены источником</text><text x="906.5405405405404" y="298" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Запросить полный экспорт</text><rect x="1226.7027027027025" y="281" width="86" height="25" rx="4" fill="#FBECEE"/><text x="1236.7027027027025" y="298" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Блокирует</text><rect x="216" y="347" width="1192" height="80" rx="0" fill="#FFFFFF"/><path d="M216 427H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="378" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">SRC-002</text><text x="374.97297297297297" y="378" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Объект</text><text x="584.3783783783783" y="378" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Название совпадает с двумя единицами</text><text x="906.5405405405404" y="378" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Подтвердить соответствие</text><rect x="1226.7027027027025" y="361" width="115" height="25" rx="4" fill="#FFF2D9"/><text x="1236.7027027027025" y="378" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Нужно решение</text><rect x="216" y="427" width="1192" height="80" rx="0" fill="#FFFFFF"/><path d="M216 507H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="458" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">SRC-003</text><text x="374.97297297297297" y="458" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Валюта</text><text x="584.3783783783783" y="458" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">В файле отсутствует</text><text x="906.5405405405404" y="458" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Получить подтверждение</text><rect x="1226.7027027027025" y="441" width="86" height="25" rx="4" fill="#FBECEE"/><text x="1236.7027027027025" y="458" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Блокирует</text><rect x="216" y="507" width="1192" height="80" rx="0" fill="#FFFFFF"/><path d="M216 587H1408" stroke="#D6DDE3" stroke-width="1"/><text x="230" y="538" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">SRC-004</text><text x="374.97297297297297" y="538" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Повтор строки</text><text x="584.3783783783783" y="538" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Совпадают видимые поля</text><text x="906.5405405405404" y="538" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Проверить исходный ID</text><rect x="1226.7027027027025" y="521" width="103" height="25" rx="4" fill="#FFF2D9"/><text x="1236.7027027027025" y="538" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Не склеивать</text><rect x="216" y="673" width="1192" height="182" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="240" y="711" fill="#202B36" font-family="Golos Text" font-size="20" font-weight="600">Деньги не восстановлены из суммы брони</text><text x="240" y="750" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">История оплат и залогов загружается отдельным подтверждённым набором. Примечание не создаёт финансовую операцию.</text><rect x="240" y="808" width="239" height="25" rx="4" fill="#E9EDF1"/><text x="250" y="825" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Все строки в макете синтетические</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Мобильная карточка брони"><title>Мобильная карточка брони</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="390" height="66" rx="0" fill="#FFFFFF"/><text x="20" y="39" fill="#202B36" font-family="Golos Text" font-size="19" font-weight="600">Кей Календарь</text><text x="327" y="39" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="20" y="103" fill="#202B36" font-family="Golos Text" font-size="22" font-weight="600">Бронь КК-1042</text><rect x="20" y="126" width="111" height="25" rx="4" fill="#E6F3EC"/><text x="30" y="143" fill="#19644C" font-family="Golos Text" font-size="12" font-weight="500">Подтверждена</text><rect x="20" y="171" width="350" height="469" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="36" y="207" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Объект</text><text x="36" y="232" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="500">Парковая 12 · 101</text><text x="36" y="273" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Даты</text><text x="36" y="298" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="500">24–27 сен · 3 ночи</text><text x="36" y="339" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Гость</text><text x="36" y="364" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="500">Гость А-01 · 2 взрослых</text><text x="36" y="405" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Стоимость</text><text x="36" y="430" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="500">12 600 ₽</text><text x="36" y="471" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Оплачено</text><text x="36" y="496" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="500">4 200 ₽</text><text x="36" y="537" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">К доплате</text><text x="36" y="562" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="500">8 400 ₽</text><rect x="20" y="665" width="350" height="44" rx="5" fill="#2458A6"/><text x="35" y="692.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Принять оплату</text><rect x="20" y="717" width="350" height="44" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="35" y="744.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Изменить проживание</text><rect x="0" y="785" width="390" height="59" rx="0" fill="#FFFFFF" stroke="#D6DDE3"/><text x="17" y="818" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="400">Сегодня</text><text x="114" y="818" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Брони</text><text x="211" y="818" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Задачи</text><text x="308" y="818" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Ещё</text></svg>
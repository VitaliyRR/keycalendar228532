<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-label="Восстановление и MFA"><title>Восстановление и MFA</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="0" y="0" width="184" height="960" rx="0" fill="#EDEFEF"/><rect x="184" y="0" width="1256" height="64" rx="0" fill="#FFFFFF"/><path d="M184 64H1440" stroke="#D6DDE3" stroke-width="1"/><rect x="22" y="20" width="26" height="26" rx="5" fill="#2458A6"/><rect x="27" y="27" width="16" height="13" rx="1" fill="none" stroke="#FFFFFF"/><path d="M27 31H43" stroke="#FFFFFF" stroke-width="1"/><path d="M31 24L31 29" stroke="#FFFFFF" stroke-width="1"/><path d="M39 24L39 29" stroke="#FFFFFF" stroke-width="1"/><text x="57" y="30" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Кей</text><text x="57" y="48" fill="#202B36" font-family="Golos Text" font-size="15" font-weight="600">Календарь</text><text x="216" y="39" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="500">Дом у парка</text><path d="M312.0 33l4 4 4-4" fill="none" stroke="#202B36" stroke-width="1.5"/><text x="1155" y="39" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Поиск  Ctrl K</text><text x="1357" y="40" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="600">МК</text><text x="23" y="102" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Шахматка</text><text x="23" y="142" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Бронирования</text><text x="23" y="182" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Объекты</text><text x="23" y="222" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Цены и правила</text><text x="23" y="262" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Гости</text><text x="23" y="302" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Финансы</text><text x="23" y="342" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Отчёты</text><text x="23" y="382" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Задачи</text><text x="23" y="422" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Каналы</text><text x="23" y="462" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сообщения</text><rect x="10" y="480" width="164" height="34" rx="4" fill="#EAF0FA"/><rect x="10" y="480" width="3" height="34" rx="0" fill="#2458A6"/><text x="23" y="502" fill="#2458A6" font-family="Golos Text" font-size="13" font-weight="500">Сотрудники</text><text x="23" y="542" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Настройки</text><path d="M20 812H164" stroke="#D6DDE3" stroke-width="1"/><text x="22" y="845" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">База знаний</text><text x="22" y="882" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="400">Марина К.</text><text x="22" y="904" fill="#596775" font-family="Golos Text" font-size="11" font-weight="400">Администратор</text><text x="216" y="108" fill="#202B36" font-family="Golos Text" font-size="26" font-weight="600">Восстановление и MFA</text><text x="216" y="137" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Дом у парка · демонстрационное рабочее пространство</text><path d="M216 893H1408" stroke="#D6DDE3" stroke-width="1"/><text x="216" y="919" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">SCR-IAM-02  /  Восстановление доступа и MFA; доступ восстановлен с отзывом других сессий</text><text x="216" y="941" fill="#596775" font-family="Golos Text" font-size="10" font-weight="400">Демонстрационные данные • Исходник SVG редактируется по слоям • Требования связаны в screens.json</text><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F4F5F7"/><rect x="96" y="80" width="1248" height="798" rx="8" fill="#FFFFFF" stroke="#D6DDE3"/><rect x="96" y="80" width="464" height="798" rx="0" fill="#EDEFEF"/><text x="136" y="145" fill="#202B36" font-family="Golos Text" font-size="24" font-weight="600">Кей Календарь</text><text x="136" y="250" fill="#202B36" font-family="Golos Text" font-size="24" font-weight="500">Рабочий день начинается</text><text x="136" y="288" fill="#202B36" font-family="Golos Text" font-size="24" font-weight="500">с понятного календаря.</text><text x="136" y="346" fill="#596775" font-family="Golos Text" font-size="15" font-weight="400">Бронирования, занятость и расчёты для</text><text x="136" y="368" fill="#596775" font-family="Golos Text" font-size="15" font-weight="400">команды управления арендой.</text><text x="642" y="190" fill="#202B36" font-family="Golos Text" font-size="25" font-weight="600">Восстановить доступ</text><text x="642" y="226" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Используйте рабочую почту. Сообщение не раскрывает, зарегистрирован ли адрес</text><text x="642" y="248" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">в системе.</text><text x="642" y="304" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Электронная почта</text><rect x="642" y="314" width="568" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="654" y="340" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">manager@example.test</text><rect x="642" y="492" width="568" height="36" rx="5" fill="#2458A6"/><text x="657" y="515.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Отправить ссылку</text><text x="642" y="567" fill="#2458A6" font-family="Golos Text" font-size="14" font-weight="400">Вернуться ко входу</text><rect x="642" y="620" width="568" height="130" rx="5" fill="#EAF0FA"/><text x="666" y="651" fill="#2458A6" font-family="Golos Text" font-size="14" font-weight="400">Если для этого адреса есть аккаунт, мы отправим инструкцию. Ссылка</text><text x="666" y="673" fill="#2458A6" font-family="Golos Text" font-size="14" font-weight="400">действует 30 минут.</text><text x="642" y="823" fill="#596775" font-family="Golos Text" font-size="12" font-weight="400">Условия сервиса   Политика обработки данных</text></svg>
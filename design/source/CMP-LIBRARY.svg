<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-label="Компоненты и состояния"><title>Компоненты и состояния</title><desc>Редактируемый макет Кей Календаря. Все данные вымышлены. Не является приложением.</desc><rect x="0" y="0" width="1440" height="1200" rx="0" fill="#F4F5F7"/><text x="40" y="60" fill="#202B36" font-family="Golos Text" font-size="29" font-weight="600">Библиотека компонентов</text><text x="40" y="94" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Варианты, состояния и поведение · Кей Календарь</text><text x="40" y="152" fill="#202B36" font-family="Golos Text" font-size="18" font-weight="600">CMP-BUTTON · действия</text><rect x="40" y="181" width="162" height="36" rx="5" fill="#2458A6"/><text x="55" y="204.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Сохранить</text><rect x="224" y="181" width="162" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="239" y="204.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Отмена</text><rect x="394" y="181" width="162" height="36" rx="5" fill="#FFFFFF" stroke="#D6DDE3"/><text x="409" y="204.0" fill="#202B36" font-family="Golos Text" font-size="13" font-weight="500">Повторить</text><rect x="586" y="181" width="162" height="36" rx="5" fill="#A52A38"/><text x="601" y="204.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Удалить</text><rect x="784" y="181" width="162" height="36" rx="5" fill="#E9EDF1"/><text x="799" y="204" fill="#596775" font-family="Golos Text" font-size="13" font-weight="400">Сохранение…</text><rect x="981" y="177" width="170" height="44" rx="6" fill="none" stroke="#2458A6"/><rect x="985" y="181" width="162" height="36" rx="5" fill="#2458A6"/><text x="1000" y="204.0" fill="#FFFFFF" font-family="Golos Text" font-size="13" font-weight="500">Фокус</text><text x="40" y="270" fill="#202B36" font-family="Golos Text" font-size="18" font-weight="600">CMP-FIELD · поля</text><text x="40" y="309" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Название *</text><rect x="40" y="319" width="390" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="52" y="345" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Парковая 12</text><text x="481" y="309" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Заезд *</text><rect x="481" y="319" width="390" height="40" rx="4" fill="#FFFFFF" stroke="#A52A38"/><text x="493" y="345" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">31.02.2026</text><text x="481" y="379" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="400">Такой даты нет. Укажите дату заезда.</text><text x="922" y="309" fill="#596775" font-family="Golos Text" font-size="12" font-weight="500">Секрет</text><rect x="922" y="319" width="390" height="40" rx="4" fill="#FFFFFF" stroke="#D6DDE3"/><text x="934" y="345" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">••••••••••••</text><text x="40" y="438" fill="#202B36" font-family="Golos Text" font-size="18" font-weight="600">CMP-STATUS · статус и оплата</text><rect x="40" y="469" width="111" height="25" rx="4" fill="#E6F3EC"/><text x="50" y="486" fill="#19644C" font-family="Golos Text" font-size="12" font-weight="500">Подтверждена</text><rect x="171" y="469" width="64" height="25" rx="4" fill="#EAF0FA"/><text x="181" y="486" fill="#2458A6" font-family="Golos Text" font-size="12" font-weight="500">Заявка</text><rect x="255" y="469" width="124" height="25" rx="4" fill="#FFF2D9"/><text x="265" y="486" fill="#85530A" font-family="Golos Text" font-size="12" font-weight="500">Ожидает оплаты</text><rect x="399" y="469" width="81" height="25" rx="4" fill="#FBECEE"/><text x="409" y="486" fill="#A52A38" font-family="Golos Text" font-size="12" font-weight="500">Конфликт</text><rect x="500" y="469" width="82" height="25" r
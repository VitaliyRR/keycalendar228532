ext><text x="738" y="1034" fill="#202B36" font-family="Golos Text" font-size="14" font-weight="400">Продлить проживание</text><text x="738" y="1080" fill="#A52A38" font-family="Golos Text" font-size="14" font-weight="400">Отменить бронь</text><text x="1020" y="937" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">Меню управляется стрелками. Enter</text><text x="1020" y="959" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">выбирает действие. Escape закрывает</text><text x="1020" y="981" fill="#596775" font-family="Golos Text" font-size="14" font-weight="400">и возвращает фокус.</text></svg>
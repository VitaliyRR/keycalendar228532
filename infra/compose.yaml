services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycalendar
      POSTGRES_USER: keycalendar_owner
      POSTGRES_PASSWORD: ${KEYCALENDAR_DB_OWNER_PASSWORD:?Set owner password in local environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - keycalendar_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycalendar_owner -d keycalendar"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  keycalendar_pg:
